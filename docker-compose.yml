version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krishnaveni-physio-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://physiouser:secretpass@postgres:5432/physiodb
      - ADMIN_EMAIL=admin@krishnaveniphysio.com
      - ADMIN_PASSWORD=ChangeMeInProduction123!
      - JWT_SECRET=super_secure_jwt_token_secret_string_32chars
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: krishnaveni-physio-db
    restart: always
    environment:
      POSTGRES_DB: physiodb
      POSTGRES_USER: physiouser
      POSTGRES_PASSWORD: secretpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physiouser -d physiodb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
